global:
  scrape_interval: 15s

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['food-backend:4000']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'food-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['food-backend:4000']
