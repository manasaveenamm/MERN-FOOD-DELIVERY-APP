
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: food-backend:latest
    container_name: food-backend
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    restart: always
    networks:
      - monitoring-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: food-frontend:latest
    container_name: food-frontend
    ports:
      - "8081:80"
    restart: always

networks:
  monitoring-net:
    external: true
